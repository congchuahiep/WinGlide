name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Đọc version từ Cargo.toml và kiểm tra tag tương ứng đã tồn tại chưa
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check-tag.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $package = [regex]::Match($content, '(?s)\[package\].*?(?=\r?\n\[)').Value
          $version = [regex]::Match($package, 'version\s*=\s*"([^"]+)"').Groups[1].Value
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "::notice::Cargo.toml version = $version"

      - name: Check if tag already exists
        id: check-tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $hasTag = [bool](git tag --list $tag)
          Write-Output "skip=$($hasTag.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($hasTag) {
            Write-Output "::notice::Tag $tag already exists - skipping release"
          } else {
            Write-Output "::notice::Tag $tag not found - building and releasing"
          }

  build:
    needs: check-version
    if: needs.check-version.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-wix
        run: cargo binstall cargo-wix -y

      - name: Build project
        run: cargo build --release

      - name: Gather dependencies
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target\release\WinGlide.exe dist\
          Copy-Item target\release\*.dll dist\
          Copy-Item target\release\*.pri dist\
          Copy-Item target\release\Microsoft.UI.Xaml dist\ -Recurse
          Get-ChildItem target\release | Where-Object { $_.PSIsContainer -and $_.Name -match "^[a-z]{2}(-[A-Za-z]+)*$" } | Copy-Item -Destination dist\ -Recurse

      - name: Harvest dependencies with heat
        run: |
          # Dùng wix v3 heat.exe có sẵn trên GitHub Actions windows-latest
          & "${env:WIX}bin\heat.exe" dir dist -cg AppDependencies -dr APPLICATIONFOLDER -scom -sreg -sfrag -srd -gg -var var.DistDir -out wix\dependencies.wxs

      - name: Build MSI Installer
        run: cargo wix --nocapture --no-build -p winglide -C -dDistDir=dist -L -sval

      - name: Rename Installer
        run: |
          Move-Item "target\wix\winglide-*.msi" "target\wix\WinGlide-x86_64.msi"

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path dist\* -DestinationPath target\wix\WinGlide-Portable-x86_64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: WinGlide v${{ needs.check-version.outputs.version }}
          files: |
            target\wix\WinGlide-x86_64.msi
            target\wix\WinGlide-Portable-x86_64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
